name: ⚙️ Tarefa Interna
description: Registre uma tarefa interna de infraestrutura, manutenção ou melhoria sem vínculo direto a cliente
title: "[INTERNO] "
labels: ["internal"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use este formulário para tarefas internas da equipe: upgrades de stack, hardening, migrações, padronizações e melhorias operacionais.

  - type: dropdown
    id: categoria
    attributes:
      label: Categoria
      options:
        - Upgrade / Atualização
        - Hardening / Segurança
        - Migração
        - Padronização
        - Manutenção preventiva
        - Melhoria de processo
        - Outro
    validations:
      required: true

  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: O que precisa ser feito e por quê?
    validations:
      required: true

  - type: textarea
    id: escopo
    attributes:
      label: Escopo e sistemas afetados
      description: Quais ambientes, servidores ou serviços serão impactados?
    validations:
      required: true

  - type: textarea
    id: criterios
    attributes:
      label: Critérios de conclusão
      description: Como saberemos que a tarefa foi concluída com sucesso?
      placeholder: |
        - [ ] Critério 1
        - [ ] Critério 2
    validations:
      required: true

  - type: dropdown
    id: prioridade
    attributes:
      label: Prioridade
      options:
        - Baixa
        - Média
        - Alta
        - Crítica
    validations:
      required: true

  - type: input
    id: prazo
    attributes:
      label: Prazo esperado (opcional)
      placeholder: Ex: 2026-05-15
